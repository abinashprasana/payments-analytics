name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python contracts and generated-data drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify generated case-study data
        run: python scripts/generate_artifacts.py --check

  postgres-parity:
    name: DuckDB and PostgreSQL model parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payments_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payments_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: payments_analytics
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_CONNECT_TIMEOUT: "5"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt -r requirements-postgres.txt

      - name: Compare canonical models on both engines
        run: python scripts/check_sql_parity.py

  site:
    name: Case-study lint, types, and static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      NEXT_PUBLIC_BASE_PATH: /payments-analytics
      NEXT_PUBLIC_SITE_URL: https://abinashprasana.github.io/payments-analytics/
      NEXT_PUBLIC_WORKBENCH_URL: https://abinashprasana-payments-analytics-dashboardapp-mrsz1m.streamlit.app/
      NEXT_PUBLIC_REPOSITORY_URL: https://github.com/abinashprasana/payments-analytics
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Lint site
        run: npm run lint

      - name: Type-check site
        run: npm run typecheck

      - name: Build static export
        run: npm run build

  browser-smoke:
    name: Browser smoke at four responsive widths
    needs:
      - python
      - postgres-parity
      - site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    env:
      CASE_STUDY_BASE_URL: http://127.0.0.1:3000/payments-analytics
      WORKBENCH_BASE_URL: http://127.0.0.1:8501
      NEXT_PUBLIC_BASE_PATH: /payments-analytics
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000/payments-analytics/
      NEXT_PUBLIC_WORKBENCH_URL: http://127.0.0.1:8501/
      NEXT_PUBLIC_REPOSITORY_URL: https://github.com/abinashprasana/payments-analytics
      CASE_STUDY_URL: http://127.0.0.1:3000/payments-analytics/
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install workbench dependencies
        run: python -m pip install -r ../requirements.txt

      - name: Install site dependencies
        run: npm ci

      - name: Build case study for local cross-link testing
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Mobile Lighthouse budgets
    needs:
      - site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      CASE_STUDY_BASE_URL: http://127.0.0.1:3000/payments-analytics/
      NEXT_PUBLIC_BASE_PATH: /payments-analytics
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000/payments-analytics/
      NEXT_PUBLIC_WORKBENCH_URL: http://127.0.0.1:8501/
      NEXT_PUBLIC_REPOSITORY_URL: https://github.com/abinashprasana/payments-analytics
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build case study
        run: npm run build

      - name: Install Lighthouse Chromium
        run: npx playwright install --with-deps chromium

      - name: Enforce mobile performance and accessibility budgets
        run: npm run test:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: site/.lighthouse/report.json
          if-no-files-found: ignore
          retention-days: 7
