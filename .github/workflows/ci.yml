name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and project-data drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify generated case-study data
        run: python scripts/export_site_data.py --check

  site:
    name: Case-study lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_LAB_URL: https://example.com/lab
      NEXT_PUBLIC_REPOSITORY_URL: https://github.com/example/payment-observatory
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Lint site
        run: npm run lint

      - name: Type-check site
        run: npm run typecheck

      - name: Build site
        run: npm run build

  browser-smoke:
    name: Browser smoke at four responsive widths
    needs:
      - python
      - site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    env:
      CASE_STUDY_BASE_URL: http://127.0.0.1:3000
      LAB_BASE_URL: http://127.0.0.1:8501
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_LAB_URL: http://127.0.0.1:8501
      NEXT_PUBLIC_REPOSITORY_URL: https://github.com/example/payment-observatory
      CASE_STUDY_URL: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dashboard dependencies
        run: python -m pip install -r ../requirements.txt

      - name: Install site dependencies
        run: npm ci

      - name: Build case study for local cross-link testing
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Mobile Lighthouse budgets
    needs:
      - site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      CASE_STUDY_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_LAB_URL: http://127.0.0.1:8501
      NEXT_PUBLIC_REPOSITORY_URL: https://github.com/example/payment-observatory
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build case study
        run: npm run build

      - name: Install Lighthouse Chromium
        run: npx playwright install --with-deps chromium

      - name: Enforce mobile performance and accessibility budgets
        run: npm run test:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: site/.lighthouse/report.json
          if-no-files-found: ignore
          retention-days: 7
